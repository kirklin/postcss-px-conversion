<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Try postcss-px-conversion in the browser: convert px to vw, vh, vmin, vmax, rem and rpx, and see the result on screens of every width."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>postcss-px-conversion playground</title>
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
