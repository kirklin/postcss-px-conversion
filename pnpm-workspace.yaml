ignoreWorkspaceRootCheck: true
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
shellEmulator: true

packages:
  - playground

allowBuilds:
  "@parcel/watcher": false
  esbuild: true
  simple-git-hooks: true

catalogs:
  cli:
    "@antfu/ni": ^30.6.0
    "@kirklin/eslint-config": ^8.5.0
    "@typescript/native": npm:typescript@^7.0.2
    bumpp: ^12.3.0
    eslint: ^10.12.0
    eslint-plugin-erasable-syntax-only: ^0.7.2
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
    taze: ^21.3.0
    typescript: npm:@typescript/typescript6@^6.0.2
    unbuild: ^3.6.1
  playground:
    "@kirklin/reset-css": ^0.0.6
    "@vitejs/plugin-vue": ^6.0.9
    sass: ^1.105.1
    vite: ^8.3.4
    vue: ^3.5.43
    vue-tsc: ^3.3.12
  testing:
    postcss: ^8.5.29
    vitest: ^5.0.3
  types:
    "@types/node": ^26.6.5
